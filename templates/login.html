<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANPR System — Login</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap');

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: #0a0a0f;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Blurred background */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, #00ff9915 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, #4488ff10 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, #ff444410 0%, transparent 50%);
            filter: blur(40px);
            z-index: 0;
        }

        /* Animated grid */
        .grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(#00ff9908 1px, transparent 1px),
                linear-gradient(90deg, #00ff9908 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0%   { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Fake blurred dashboard behind */
        .fake-dashboard {
            position: fixed;
            inset: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            filter: blur(6px) brightness(0.3);
            pointer-events: none;
        }
        .fake-nav {
            height: 55px;
            background: #12121a;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .fake-cards {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .fake-card {
            height: 100px;
            background: #12121a;
            border-radius: 8px;
        }
        .fake-main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            flex: 1;
        }
        .fake-panel {
            background: #12121a;
            border-radius: 8px;
        }

        /* Login card */
        .login-card {
            position: relative;
            z-index: 10;
            background: #12121aee;
            border: 1px solid #00ff9933;
            border-radius: 16px;
            padding: 50px 40px;
            width: 420px;
            backdrop-filter: blur(20px);
            box-shadow:
                0 0 60px #00ff9915,
                0 20px 60px #00000080;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 35px;
        }
        .logo-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .logo-title {
            font-family: 'Orbitron', monospace;
            font-size: 1.8rem;
            font-weight: 900;
            color: #00ff99;
            letter-spacing: 4px;
        }
        .logo-sub {
            color: #444;
            font-size: 0.8rem;
            margin-top: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            color: #666;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0a0a0f;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00ff99;
            box-shadow: 0 0 0 3px #00ff9915;
        }

        .btn-login {
            width: 100%;
            padding: 13px;
            background: #00ff99;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover {
            background: #00cc77;
            transform: translateY(-1px);
            box-shadow: 0 5px 20px #00ff9940;
        }

        .error {
            background: #ff444420;
            border: 1px solid #ff444440;
            color: #ff4444;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .notice {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #1a1a2a;
        }
        .notice p {
            color: #333;
            font-size: 0.75rem;
            line-height: 1.6;
        }
        .notice span { color: #00ff9966; }
    </style>
</head>
<body>

<div class="bg"></div>
<div class="grid"></div>

<!-- Blurred fake dashboard -->
<div class="fake-dashboard">
    <div class="fake-nav"></div>
    <div class="fake-cards">
        <div class="fake-card"></div>
        <div class="fake-card"></div>
        <div class="fake-card"></div>
    </div>
    <div class="fake-main">
        <div class="fake-panel"></div>
        <div class="fake-panel"></div>
    </div>
</div>

<!-- Login Card -->
<div class="login-card">
    <div class="logo-section">
        <div class="logo-icon">🚔</div>
        <div class="logo-title">ANPR</div>
        <div class="logo-sub">Watchlist Alert & Logging System</div>
    </div>

    {% if error %}
    <div class="error">⚠ {{ error }}</div>
    {% endif %}

    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username"
                   placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password"
                   placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn-login">Sign In →</button>
    </form>

    <div class="notice">
        <p>🔒 Authorized personnel only</p>
        <p><span>⚠ Initial Development Phase</span> —
           This system is under active development.<br>
           For authorized use only. All detections are logged.</p>
    </div>
</div>

</body>
</html>
